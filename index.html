<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokéLeader - Browser Game</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-main: #1e1b4b;
  --bg-card: #2e2a72;
  --bg-accent: #3b358d;
  --text-main: #ffffff;
  --text-mut: #a5b4fc;
  --yellow: #facc15;
  --yellow-hover: #eab308;
  --red: #ef4444;
  --green: #22c55e;
  --blue: #3b82f6;
  --purple: #8b5cf6;
  --border: #4338ca;
  --card-shadow: 0 8px 0px #110e38;
}

* { box-sizing: border-box; font-family: 'Fredoka', sans-serif; }

body {
  margin: 0;
  background: var(--bg-main);
  color: var(--text-main);
  background-image: radial-gradient(#312e81 1.5px, transparent 1.5px);
  background-size: 24px 24px;
  min-height: 100vh;
}

header {
  background: rgba(17, 14, 56, 0.95);
  border-bottom: 3px solid var(--yellow);
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

.brand-title {
  font-family: 'Press Start 2P', monospace;
  color: var(--yellow);
  font-size: 18px;
  text-shadow: 2px 2px 0px #000;
  margin: 0;
}

.lang-selector button {
  padding: 4px 8px;
  font-size: 14px;
  border-radius: 8px;
  border: 1px solid var(--yellow);
  background: var(--bg-card);
  color: #fff;
  cursor: pointer;
  margin-left: 4px;
}

.lang-selector button.active {
  background: var(--yellow);
  color: #000;
  font-weight: bold;
}

main {
  max-width: 820px;
  margin: 0 auto;
  padding: 20px 16px;
}

h1, h2, h3 {
  font-family: 'Press Start 2P', monospace;
  color: var(--yellow);
  text-shadow: 3px 3px 0px #000;
  margin: 0 0 12px 0;
  line-height: 1.4;
}

h1 { font-size: 18px; text-align: center; }
h2 { font-size: 14px; }
.mut { color: var(--text-mut); font-size: 14px; font-weight: 600; }

.badge {
  background: var(--bg-accent);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 16px;
  box-shadow: var(--card-shadow);
}

.intro-box {
  background: var(--bg-card);
  border: 3px solid var(--yellow);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 20px;
  box-shadow: var(--card-shadow);
}

.intro-box p {
  font-size: 14px;
  line-height: 1.5;
  margin: 6px 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 12px;
  margin: 16px 0;
}

button {
  background: var(--yellow);
  color: #1e1b4b;
  border: 3px solid #000;
  border-radius: 14px;
  padding: 12px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 0px #000;
  transition: transform 0.1s, background 0.1s;
}

button:hover {
  background: var(--yellow-hover);
  transform: translateY(-2px);
}

button:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0px #000;
}

button.btn-sec {
  background: var(--bg-card);
  color: var(--text-main);
  border-color: var(--border);
  box-shadow: 0 4px 0px #110e38;
}

button.btn-sec:hover {
  background: var(--bg-accent);
}

.field {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin: 16px 0;
}

.mon {
  background: var(--bg-card);
  border: 3px solid var(--border);
  border-radius: 16px;
  padding: 12px;
  text-align: center;
  box-shadow: var(--card-shadow);
  position: relative;
}

.mon img {
  width: 96px;
  height: 96px;
  image-rendering: pixelated;
  filter: drop-shadow(0px 4px 0px rgba(0,0,0,0.3));
}

.bar {
  height: 12px;
  background: #110e38;
  border: 2px solid #000;
  border-radius: 8px;
  overflow: hidden;
  margin-top: 6px;
}

.bar i {
  display: block;
  height: 100%;
  background: var(--green);
  transition: width .3s;
}

.log {
  background: #0f172a;
  border: 3px solid #334155;
  border-radius: 14px;
  padding: 12px;
  height: 160px;
  overflow-y: auto;
  font-size: 13px;
  margin-top: 12px;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
  font-family: monospace;
}

.moves {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}

.tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 10px;
  background: #334155;
  color: #fff;
  margin: 2px;
  border: 1px solid rgba(255,255,255,0.2);
}

.item-card, .team-list-item {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 10px 12px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.held-badge, .ability-badge, .nature-badge {
  font-size: 11px;
  background: var(--purple);
  color: #fff;
  padding: 2px 6px;
  border-radius: 8px;
  margin-top: 4px;
  display: inline-block;
}

.ability-badge { background: #0284c7; }
.nature-badge { background: #d97706; }

.stat-stages {
  font-size: 11px;
  margin-top: 4px;
  color: #fde047;
}
</style>
</head>
<body>

<header>
  <div class="brand-title">⚡ PokéLeader</div>
  <div class="lang-selector">
    <button id="lang-it" onclick="setLang('it')">🇮🇹</button>

</header>

<main id="app">Caricamento in corso...</main>

<script>
const STATS = ['hp', 'attack', 'defense', 'special-attack', 'special-defense', 'speed'];
const LADDER = [
  [1, 10, 'Novice'], [11, 20, 'Gym 1'], [21, 30, 'Gym 2'],
  [31, 40, 'Gym 3'], [41, 50, 'Gym 4'], [51, 60, 'Gym 5'],
  [61, 70, 'Gym 6'], [71, 80, 'Gym 7'], [81, 90, 'Gym 8'], [91, 99, 'Elite Four']
];
const CAP = [10, 25, 45, 65, 85];
const BAN = new Set([
  'explosion', 'self-destruct', 'hyper-beam', 'giga-impact', 'fly', 'dig', 'dive',
  'bounce', 'solar-beam', 'solar-blade', 'skull-bash', 'razor-wind', 'sky-attack',
  'focus-punch', 'fissure', 'guillotine', 'horn-drill', 'sheer-cold', 'future-sight',
  'doom-desire', 'last-resort', 'dream-eater', 'belch', 'fake-out', 'sucker-punch',
  'steel-beam', 'mind-blown', 'misty-explosion', 'shadow-force', 'phantom-force',
  'freeze-shock', 'ice-burn', 'meteor-beam', 'electro-shot', 'sky-drop', 'synchronoise', 'struggle'
]);

const I18N = {
  it: {
    ruleTitle: "📜 REGOLAMENTO DI GIOCO",
    rule1: "🏆 <b>Obiettivo:</b> Sali fino al <b>Livello 100</b> e diventa il Campione della Lega Pokémon!",
    rule2: "⚔️ <b>Lotte:</b> Vinci per salire di livello; la sconfitta ti fa retrocedere.",
    rule3: "🌱 <b>Nature & Abilità:</b> Scegli la natura migliore per i tuoi Pokémon e usa le loro abilità passive.",
    rule4: "💥 <b>Mosse di Stato:</b> Usa mosse come Danzaspada o Mugito per alterare le statistiche in battaglia!",
    chooseType: "Scegli il tuo Tipo Specializzato:",
    contRun: "Continua Avventura",
    chooseStarter: "SCEGLI LO STARTER",
    chooseNature: "SCEGLI LA NATURA",
    natureDesc: "Scegli la natura per ",
    goFight: "Lotta contro lo Sfidante",
    manageTeam: "Gestisci Squadra",
    bag: "Zaino",
    abandon: "Abbandona",
    victory: "👑 VITTORIA DEFINITIVA! 👑",
    victoryDesc: "Complimenti! Hai raggiunto il <b>Livello 100</b> e sei diventato il <b>CAMPIONE ASSOLUTO DELLA LEGA</b>!",
    newAv: "Inizia una Nuova Avventura",
    tradeTitle: "🔄 PROPOSTA DI SCAMBIO!",
    tradeDesc: "Un Allenatore ti offre ",

    declineTrade: "Rifiuta lo Scambio",
    newCapture: "NUOVA CATTURA!",
    captureDesc: "Scegli un nuovo Pokémon per la tua palestra."
  },
  en: {
    ruleTitle: "📜 GAME RULES",
    rule1: "🏆 <b>Goal:</b> Reach <b>Level 100</b> and become the Pokémon League Champion!",
    rule2: "⚔️ <b>Battles:</b> Win to level up; losing decreases your level.",
    rule3: "🌱 <b>Natures & Abilities:</b> Pick the best nature for your Pokémon and leverage passive abilities.",
    rule4: "💥 <b>Status Moves:</b> Use stat-altering moves like Swords Dance or Growl in battle!",
    chooseType: "Choose your Specialized Type:",
    contRun: "Continue Adventure",
    chooseStarter: "CHOOSE YOUR STARTER",
    chooseNature: "CHOOSE A NATURE",
    natureDesc: "Pick a nature for ",
    goFight: "Battle Challenger",
    manageTeam: "Manage Team",
    bag: "Bag",
    abandon: "Forfeit",
    victory: "👑 ULTIMATE VICTORY! 👑",
    victoryDesc: "Congratulations! You reached <b>Level 100</b> and became the <b>POKÉMON LEAGUE CHAMPION</b>!",
    newAv: "Start New Adventure",
    tradeTitle: "🔄 TRADE OFFER!",
    tradeDesc: "A Trainer offers you ",
    tradeFor: " in exchange for one of your Pokémon!",
    declineTrade: "Decline Trade",
    newCapture: "NEW CATCH!",
    captureDesc: "Choose a new Pokémon for your Gym."
  },
  es: {
    ruleTitle: "📜 REGLAS DEL JUEGO",
    rule1: "🏆 <b>Objetivo:</b> ¡Llega al <b>Nivel 100</b> y conviértete en el Campeón de la Liga!",
    rule2: "⚔️ <b>Combates:</b> Gana para subir de nivel; perder te hará bajar.",
    rule3: "🌱 <b>Naturalezas y Habilidades:</b> Elige la mejor naturaleza para tus Pokémon y aprovecha sus habilidades.",
    rule4: "💥 <b>Movimientos de Estado:</b> ¡Usa movimientos de cambios de características en combate!",
    chooseType: "Elige tu Tipo Especializado:",
    contRun: "Continuar Aventura",
    chooseStarter: "ELIGE TU STARTER",
    chooseNature: "ELIGE UNA NATURALEZA",
    natureDesc: "Elige la naturaleza para ",
    goFight: "Luchar contra el Aspirante",
    manageTeam: "Gestionar Equipo",
    bag: "Mochila",
    abandon: "Abandonar",
    victory: "👑 ¡VICTORIA DEFINITIVA! 👑",
    victoryDesc: "¡Felicidades! Has alcanzado el <b>Nivel 100</b> y eres el <b>CAMPEÓN ABSOLUTO DE LA LIGA</b>!",
    newAv: "Empezar Nueva Aventura",
    tradeTitle: "🔄 ¡PROPUESTA DE INTERCAMBIO!",
    tradeDesc: "Un Entrenador te ofrece ",
    tradeFor: " a cambio de uno de tus Pokémon!",
    declineTrade: "Rechazar Intercambio",
    newCapture: "¡NUEVA CAPTURA!",
    captureDesc: "Elige un nuevo Pokémon para tu Gimnasio."
  }
};

let currentLang = 'it';
let D = {};
let run = null;
let B = null;

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-selector button').forEach(b => b.classList.remove('active'));
  getEl('#lang-' + lang).classList.add('active');
  if (run) hub(); else home();
}

function tTxt(key) { return (I18N[currentLang] || I18N.it)[key] || key; }
function getEl(selector) { return document.querySelector(selector); }
function app() { return document.querySelector('#app'); }
function rnd(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function locName(obj) {
  if (!obj) return '';
  if (obj.names && obj.names[currentLang]) return obj.names[currentLang];
  return obj.name || '';
}

function phase(level) {
  if (level >= 100) return 'Champion';
  const match = LADDER.find(item => level >= item[0] && level <= item[1]);
  return match ? match[2] : 'Final Challenge';
}

function tn(type) {
  const match = D.types.find(x => x.name === type);
  return match ? locName(match) : type;
}

function nm(mon) { return locName(D.pokemon[mon.name]); }

function saveRun() {
  try { localStorage.setItem('run', JSON.stringify(run)); } catch (e) { console.error(e); }
}

function loadRun() {
  try { return JSON.parse(localStorage.getItem('run')); } catch (e) { return null; }
}

const memo = {};
function minLevel(name) {
  if (memo[name] !== undefined) return memo[name];
  const p = D.pokemon[name];
  let v = 1;
  if (p.evolves_from && D.pokemon[p.evolves_from]) {
    const d = p.evolution_details || {};
    v = Math.max(minLevel(p.evolves_from), d.min_level || (p.stage >= 2 ? 40 : 25));
  }
  memo[name] = v;
  return v;
}

function eligible(p, L) {
  return !p.is_legendary && !p.is_mythical && !p.is_baby && minLevel(p.name) <= L && p.bst <= 330 + L * 5;
}

function evolved(name, L) {
  for (const t of D.pokemon[name].evolves_to) {
    const e = D.pokemon[t];
    const d = e.evolution_details || {};
    if (d.min_level && d.min_level <= L && !e.is_legendary) {
      return evolved(t, L);
    }
  }
  return name;
}

function pickMoves(p, L) {
  const candidates = Object.entries(p.levelup_moves)
    .filter(([mName, lvl]) => lvl <= L && D.moves[mName] && !BAN.has(mName))
    .map(([mName]) => D.moves[mName]);

  candidates.sort((a, b) => {
    const scoreA = (a.power || 20) * (p.types.includes(a.type) ? 1.5 : 1);
    const scoreB = (b.power || 20) * (p.types.includes(b.type) ? 1.5 : 1);
    return scoreB - scoreA;
  });

  const out = candidates.slice(0, 4);
  if (!out.length && D.moves.tackle) out.push(D.moves.tackle);
  return out;
}

function stageMult(stage) {
  if (stage >= 0) return (2 + stage) / 2;
  return 2 / (2 + Math.abs(stage));
}

function mk(name, L, natName, currentHp, heldItem, ability) {
  const p = D.pokemon[name];
  const nat = D.natures.find(n => n.name === natName) || rnd(D.natures);
  const s = {};

  for (const k of STATS) {
    const core = Math.floor((2 * p.base_stats[k] + 15) * L / 100);
    if (k === 'hp') {
      s.hp = core + L + 10;
    } else {
      const mult = nat.increases === k ? 1.1 : (nat.decreases === k ? 0.9 : 1);
      s[k] = Math.floor((core + 5) * mult);
    }
  }

  if (heldItem === 'choice-scarf') s.speed = Math.floor(s.speed * 1.5);
  if (heldItem === 'choice-band') s.attack = Math.floor(s.attack * 1.5);
  if (heldItem === 'choice-specs') s['special-attack'] = Math.floor(s['special-attack'] * 1.5);
  if (heldItem === 'assault-vest') s['special-defense'] = Math.floor(s['special-defense'] * 1.5);

  const chosenAbility = ability || (p.abilities && p.abilities.length ? rnd(p.abilities) : 'nessuna');
  const maxHp = s.hp;
  const hpVal = (currentHp !== undefined && currentHp !== null) ? Math.min(currentHp, maxHp) : maxHp;

  return {
    name: name,
    L: L,
    nat: nat.name,
    natObj: nat,
    types: p.types,
    s: s,
    hp: hpVal,
    heldItem: heldItem || null,
    ability: chosenAbility,
    stages: { attack: 0, defense: 0, 'special-attack': 0, 'special-defense': 0, speed: 0 },
    moves: pickMoves(p, L)
  };
}

function mult(mt, d) {
  if (d.ability === 'levitate' && mt === 'ground') return 0;
  return d.types.reduce((a, t) => {
    const eff = (D.eff[mt] || {})[t];
    return a * (eff !== undefined ? eff : 1);
  }, 1);
}

function getStat(m, statKey) {
  const base = m.s[statKey];
  const stage = m.stages[statKey] || 0;
  return Math.floor(base * stageMult(stage));
}

function dmg(a, d, m, rand = true) {
  if (!m.power) return 0;
  const ph = m.damage_class === 'physical';
  const A = getStat(a, ph ? 'attack' : 'special-attack');
  const De = getStat(d, ph ? 'defense' : 'special-defense');
  let x = Math.floor(Math.floor(Math.floor(2 * a.L / 5 + 2) * m.power * A / De) / 50) + 2;

  let typeMult = a.types.includes(m.type) ? 1.5 : 1;
  if (a.hp <= a.s.hp / 3) {
    if ((a.ability === 'torrent' && m.type === 'water') ||
        (a.ability === 'blaze' && m.type === 'fire') ||
        (a.ability === 'overgrow' && m.type === 'grass')) {
      typeMult *= 1.5;
    }
  }

  x *= typeMult * mult(m.type, d);
  if (a.heldItem === 'life-orb') x *= 1.3;
  if (rand) x *= 0.85 + Math.random() * 0.15;
  return Math.floor(x);
}

function modifyStage(target, statKey, amount, say) {
  if (!target.stages[statKey] && target.stages[statKey] !== 0) target.stages[statKey] = 0;
  const old = target.stages[statKey];
  target.stages[statKey] = Math.max(-6, Math.min(6, target.stages[statKey] + amount));
  const diff = target.stages[statKey] - old;

  const statNames = { 'attack': 'Attacco', 'defense': 'Difesa', 'special-attack': 'Attacco Sp.', 'special-defense': 'Difesa Sp.', 'speed': 'Velocità' };
  const label = statNames[statKey] || statKey;

  if (diff > 0) say(nm(target) + ': ' + label + ' ↑!');
  else if (diff < 0) say(nm(target) + ': ' + label + ' ↓!');
}

function applyAbilityOnEntry(mon, opp, say) {
  if (mon.ability === 'intimidate' && opp.hp > 0) {
    say('Prepotenza di ' + nm(mon) + '!');
    modifyStage(opp, 'attack', -1, say);
  }
}

function chooseNpc(a, d) {
  let best = [];
  let bv = -1;
  for (const m of a.moves) {
    let v = 0;
    if (m.power) {
      v = dmg(a, d, m, false) * ((m.accuracy || 100) / 100);
    } else {
      v = 15; // Valore euristico per mosse di stato
    }
    if (v > bv + 1e-9) { bv = v; best = [m]; }
    else if (Math.abs(v - bv) < 1e-9) { best.push(m); }
  }
  return rnd(best);
}

function npcTeam(L, n) {
  const pool = Object.values(D.pokemon).filter(p => eligible(p, L));
  const team = [];
  const used = new Set();
  for (let i = 0; i < n; i++) {
    let c = pool.filter(p => !used.has(p.types[0]));
    if (!c.length) c = pool;
    const p = rnd(c);
    used.add(p.types[0]);
    team.push(mk(evolved(p.name, L), L));
  }
  return team;
}

function tagHtml(t) { return '<span class="tag">' + tn(t) + '</span>'; }

function formatStages(stages) {
  const active = [];
  const statNames = { 'attack': 'Atk', 'defense': 'Def', 'special-attack': 'SpA', 'special-defense': 'SpD', 'speed': 'Spe' };
  for (const k in stages) {
    if (stages[k] !== 0) {
      active.push(statNames[k] + (stages[k] > 0 ? '+' : '') + stages[k]);
    }
  }
  return active.length ? '<div class="stat-stages">' + active.join(' | ') + '</div>' : '';
}

function panel(m, label) {
  const itemInfo = m.heldItem && D.items[m.heldItem] ? locName(D.items[m.heldItem]) : null;
  const natInfo = m.natObj ? locName(m.natObj) : m.nat;

  return '<div class="mon">' +
    '<div class="mut">' + (label || '') + '</div>' +
    '<img src="' + (D.pokemon[m.name].sprite || '') + '" alt="' + nm(m) + '">' +
    '<div><b>' + nm(m) + '</b> <span class="mut">Lv ' + m.L + '</span></div>' +
    '<div>' + m.types.map(tagHtml).join('') + '</div>' +
    '<div class="nature-badge">🌱 ' + natInfo + '</div> ' +
    '<div class="ability-badge">⚡ ' + (m.ability || 'Nessuna') + '</div>' +
    (itemInfo ? '<div class="held-badge">🎒 ' + itemInfo + '</div>' : '') +
    formatStages(m.stages) +
    '<div class="bar"><i style="width:' + Math.max(0, 100 * m.hp / m.s.hp) + '%"></i></div>' +
    '<div class="mut" style="margin-top:4px">' + m.hp + '/' + m.s.hp + ' PS</div>' +
  '</div>';
}

function home() {
  const saved = loadRun();
  let typesHtml = '';
  for (const t of D.types) {
    typesHtml += '<button data-t="' + t.name + '">' + locName(t) + '</button>';
  }

  app().innerHTML =
    '<h1>POKÉLEADER</h1>' +
    '<div class="intro-box">' +
      '<h2 style="text-align:center;margin-bottom:8px">' + tTxt('ruleTitle') + '</h2>' +
      '<p>' + tTxt('rule1') + '</p>' +
      '<p>' + tTxt('rule2') + '</p>' +
      '<p>' + tTxt('rule3') + '</p>' +
      '<p>' + tTxt('rule4') + '</p>' +
    '</div>' +
    (saved ? '<div style="text-align:center;margin-bottom:20px"><button id="cont" style="width:100%">' + tTxt('contRun') + ' (' + tn(saved.type) + ' — Lvl ' + saved.level + ')</button></div>' : '') +
    '<h2>' + tTxt('chooseType') + '</h2>' +
    '<div class="grid">' + typesHtml + '</div>';

  if (saved) {
    getEl('#cont').onclick = () => {
      run = saved;
      if (!run.items) run.items = { potion: 1, leftovers: 1 };
      if (!run.nextTrade) run.nextTrade = run.level + Math.floor(Math.random() * 2) + 7;
      hub();
    };
  }

  document.querySelectorAll('[data-t]').forEach(b => {
    b.onclick = () => starters(b.dataset.t);
  });
}

function starters(type) {
  const pool = Object.values(D.pokemon).filter(p => p.stage === 0 && !p.is_legendary && !p.is_mythical && !p.is_baby && p.types.includes(type));
  const opts = shuffle(pool).slice(0, 3);

  let optsHtml = '';
  for (const p of opts) {
    optsHtml += '<button data-n="' + p.name + '"><img src="' + (p.sprite || '') + '" width="72" alt=""><br><b>' + locName(p) + '</b></button>';
  }

  app().innerHTML =
    '<h1>' + tTxt('chooseStarter') + '</h1>' +
    '<p class="mut" style="text-align:center">' + tTxt('chooseType') + ' ' + tn(type) + '</p>' +
    '<div class="grid">' + optsHtml + '</div>';

  document.querySelectorAll('[data-n]').forEach(b => {
    b.onclick = () => selectNatureForMon(b.dataset.n, (natName) => {
      const pData = D.pokemon[b.dataset.n];
      const ability = pData.abilities && pData.abilities.length ? rnd(pData.abilities) : null;
      run = {
        type: type,
        level: 1,
        team: [{ name: b.dataset.n, nat: natName, currentHp: null, heldItem: null, ability: ability }],
        taken: [],
        items: { potion: 2, leftovers: 1 },
        nextTrade: 7 + Math.floor(Math.random() * 2)
      };
      saveRun();
      hub();
    });
  });
}

function selectNatureForMon(monName, onSelectCallback) {
  const nats = shuffle(D.natures).slice(0, 3);
  let natsHtml = '';

  nats.forEach(n => {
    let effectStr = "Bilanciata";
    if (n.increases && n.decreases && n.increases !== n.decreases) {
      effectStr = "+" + n.increases.toUpperCase() + " / -" + n.decreases.toUpperCase();
    }
    natsHtml += '<div class="item-card">' +
      '<div><b>' + locName(n) + '</b><br><span class="mut">' + effectStr + '</span></div>' +
      '<button data-nat="' + n.name + '">Scegli</button>' +
    '</div>';
  });

  app().innerHTML =
    '<h1>' + tTxt('chooseNature') + '</h1>' +
    '<p class="mut" style="text-align:center">' + tTxt('natureDesc') + '<b>' + locName(D.pokemon[monName]) + '</b></p>' +
    '<div style="margin:20px 0">' + natsHtml + '</div>';

  document.querySelectorAll('[data-nat]').forEach(b => {
    b.onclick = () => onSelectCallback(b.dataset.nat);
  });
}

function hub(msg = '') {
  const L = run.level;

  if (L >= 100) {
    localStorage.removeItem('run');
    app().innerHTML =
      '<div class="badge" style="text-align:center;padding:24px">' +
        '<h1>' + tTxt('victory') + '</h1>' +
        '<p style="font-size:16px;line-height:1.6;margin:16px 0">' + tTxt('victoryDesc') + '</p>' +
        '<button id="h" style="width:100%;margin-top:12px">' + tTxt('newAv') + '</button>' +
      '</div>';
    getEl('#h').onclick = home;
    return;
  }

  let ev = '';
  run.team.forEach(t => {
    const n = evolved(t.name, L);
    if (n !== t.name) {
      ev += '✨ ' + locName(D.pokemon[t.name]) + ' -> ' + locName(D.pokemon[n]) + '! ';
      t.name = n;
    }
  });

  if (ev) saveRun();
  const team = run.team.map(t => mk(t.name, L, t.nat, t.currentHp, t.heldItem, t.ability));

  let fieldHtml = '';
  team.forEach((m, i) => { fieldHtml += panel(m, i === 0 ? '1° In Campo' : 'Panchina'); });

  app().innerHTML =
    '<div class="badge">' +
      '<h1>' + phase(L) + ' — LIVELLO ' + L + '/100</h1>' +
      '<div style="text-align:center" class="mut">Specializzazione: ' + tagHtml(run.type) + '</div>' +
    '</div>' +
    (msg || ev ? '<div class="badge" style="background:var(--bg-card);color:var(--yellow);text-align:center">' + msg + ' ' + ev + '</div>' : '') +
    '<h2>La tua Squadra (' + team.length + '/6)</h2>' +
    '<div class="field">' + fieldHtml + '</div>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">' +
      '<button id="go" style="flex:2">' + tTxt('goFight') + '</button>' +
      '<button id="organize" class="btn-sec" style="flex:1">' + tTxt('manageTeam') + '</button>' +
      '<button id="bag" class="btn-sec" style="flex:1">' + tTxt('bag') + '</button>' +
      '<button id="quit" class="btn-sec" style="background:#8f1d1d">' + tTxt('abandon') + '</button>' +
    '</div>';

  getEl('#go').onclick = startBattle;
  getEl('#organize').onclick = organizeTeam;
  getEl('#bag').onclick = openBag;
  getEl('#quit').onclick = () => {
    if (confirm('Ricominciare da capo?')) {
      localStorage.removeItem('run');
      run = null;
      home();
    }
  };
}

function organizeTeam() {
  let itemsHtml = '';
  run.team.forEach((t, index) => {
    const fullMon = mk(t.name, run.level, t.nat, t.currentHp, t.heldItem, t.ability);
    const itemObj = t.heldItem && D.items[t.heldItem] ? D.items[t.heldItem] : null;
    itemsHtml += '<div class="team-list-item">' +
      '<div style="display:flex;align-items:center;gap:10px">' +
        '<img src="' + (D.pokemon[t.name].sprite || '') + '" width="48" alt="">' +
        '<div>' +
          '<div><b>' + (index + 1) + '. ' + locName(D.pokemon[t.name]) + '</b></div>' +
          '<div class="mut">' + fullMon.hp + '/' + fullMon.s.hp + ' PS</div>' +
          (itemObj ? '<div class="held-badge">🎒 ' + locName(itemObj) + '</div>' : '') +
        '</div>' +
      '</div>' +
      '<div style="display:flex;gap:4px">' +
        (t.heldItem ? '<button onclick="unequipItem(' + index + ')" class="btn-sec">Rimuovi</button>' : '') +
        (index > 0 ? '<button onclick="moveMon(' + index + ', -1)">▲</button>' : '') +
        (index < run.team.length - 1 ? '<button onclick="moveMon(' + index + ', 1)">▼</button>' : '') +
      '</div>' +
    '</div>';
  });

  app().innerHTML =
    '<h1>GESTIONE SQUADRA</h1>' +
    '<div style="margin:20px 0">' + itemsHtml + '</div>' +
    '<button id="back">Indietro</button>';

  getEl('#back').onclick = hub;
}

window.moveMon = function(index, dir) {
  const target = index + dir;
  if (target < 0 || target >= run.team.length) return;
  const temp = run.team[index];
  run.team[index] = run.team[target];
  run.team[target] = temp;
  saveRun();
  organizeTeam();
};

window.unequipItem = function(index) {
  const itemKey = run.team[index].heldItem;
  if (!itemKey) return;
  run.team[index].heldItem = null;
  run.items[itemKey] = (run.items[itemKey] || 0) + 1;
  saveRun();
  organizeTeam();
};

function openBag() {
  const items = run.items || {};
  const entries = Object.entries(items).filter(e => e[1] > 0);

  let itemsHtml = '';
  if (entries.length === 0) {
    itemsHtml = '<p class="mut">Zaino vuoto.</p>';
  } else {
    entries.forEach(entry => {
      const k = entry[0];
      const count = entry[1];
      const info = D.items[k] || { names: { it: k }, descs: { it: '' }, category: 'usable' };
      itemsHtml += '<div class="item-card">' +
        '<div>' +
          '<div><b>' + locName(info) + ' (x' + count + ')</b></div>' +
          '<div class="mut" style="font-size:12px">' + (info.descs ? info.descs[currentLang] : '') + '</div>' +
        '</div>' +
        '<button onclick="useOrEquipItem(\'' + k + '\')">' + (info.category === 'held' ? 'Assegna' : 'Usa') + '</button>' +
      '</div>';
    });
  }

  app().innerHTML =
    '<h1>ZAINO STRUMENTI</h1>' +
    '<div style="margin:20px 0">' + itemsHtml + '</div>' +
    '<button id="back">Indietro</button>';

  getEl('#back').onclick = hub;
}

window.useOrEquipItem = function(itemKey) {
  const itemInfo = D.items[itemKey];
  if (!itemInfo || !run.items[itemKey] || run.items[itemKey] <= 0) return;

  let html = '<h1>' + (itemInfo.category === 'held' ? 'ASSEGNA STRUMENTO' : 'USA STRUMENTO') + '</h1><div style="margin:20px 0">';
  run.team.forEach((t, idx) => {
    const fullMon = mk(t.name, run.level, t.nat, t.currentHp, t.heldItem, t.ability);
    const currItem = t.heldItem ? (D.items[t.heldItem] ? locName(D.items[t.heldItem]) : t.heldItem) : 'Nessuno';
    html += '<div class="team-list-item">' +
      '<div style="display:flex;align-items:center;gap:10px">' +
        '<img src="' + (D.pokemon[t.name].sprite || '') + '" width="48" alt="">' +
        '<div><b>' + locName(D.pokemon[t.name]) + '</b><br><span class="mut">PS: ' + fullMon.hp + '/' + fullMon.s.hp + ' | Oggetto: ' + currItem + '</span></div>' +
      '</div>' +
      '<button onclick="applyItemToMon(\'' + itemKey + '\', ' + idx + ')">Seleziona</button>' +
    '</div>';
  });
  html += '</div><button id="cancel">Annulla</button>';
  app().innerHTML = html;
  getEl('#cancel').onclick = openBag;
};

window.applyItemToMon = function(itemKey, teamIndex) {
  const itemInfo = D.items[itemKey];
  const t = run.team[teamIndex];

  if (itemInfo.category === 'held') {
    if (t.heldItem) run.items[t.heldItem] = (run.items[t.heldItem] || 0) + 1;
    t.heldItem = itemKey;
    run.items[itemKey]--;
    saveRun();
    hub('Assegnato ' + locName(itemInfo) + ' a ' + locName(D.pokemon[t.name]) + '!');
  } else if (itemKey === 'potion' || itemKey === 'max-potion') {
    t.currentHp = null;
    run.items[itemKey]--;
    saveRun();
    hub('Hai curato completamente ' + locName(D.pokemon[t.name]) + '!');
  }
};

function startBattle() {
  const L = run.level;
  run.team.forEach(t => { t.currentHp = null; });
  saveRun();

  B = {
    me: run.team.map(t => mk(t.name, L, t.nat, null, t.heldItem, t.ability)),
    fo: npcTeam(L, run.team.length),
    mi: 0, fi: 0, over: null,
    log: ['Uno sfidante ti sfida!']
  };

  function say(t) { B.log.push(t); }
  applyAbilityOnEntry(B.me[0], B.fo[0], say);
  applyAbilityOnEntry(B.fo[0], B.me[0], say);

  fight();
}

function fight() {
  const me = B.me[B.mi];
  const fo = B.fo[B.fi];

  const myAlive = B.me.filter(m => m.hp > 0).length;
  const foAlive = B.fo.filter(m => m.hp > 0).length;

  let movesHtml = '';
  me.moves.forEach((m, i) => {
    movesHtml += '<button data-m="' + i + '">' + locName(m) + '<br><span class="mut">' + tn(m.type) + ' · Pot. ' + (m.power || '-') + '</span></button>';
  });

  const logHtml = B.log.map(l => '<div>' + l + '</div>').join('');

  app().innerHTML =
    '<div class="field">' + panel(fo, 'Sfidante') + panel(me, 'Tuo Pokémon') + '</div>' +
    '<div class="mut" style="text-align:center;margin:8px 0">I tuoi vivi: ' + myAlive + '/' + B.me.length + ' | Avversari: ' + foAlive + '/' + B.fo.length + '</div>' +
    '<div class="log" id="log">' + logHtml + '</div>' +
    (B.over ?
      '<button id="next" style="width:100%;margin-top:12px">' + (B.over === 'win' ? 'Vittoria! Continua' : 'Sconfitta... Continua') + '</button>' :
      '<div class="moves">' + movesHtml + '</div>'
    );

  const lg = getEl('#log');
  lg.scrollTop = lg.scrollHeight;

  if (B.over) {
    getEl('#next').onclick = endBattle;
  } else {
    document.querySelectorAll('[data-m]').forEach(b => {
      b.onclick = () => turn(parseInt(b.dataset.m, 10));
    });
  }
}

function checkFaint(say) {
  const me = B.me[B.mi];
  const fo = B.fo[B.fi];

  if (fo.hp <= 0) {
    say(nm(fo) + ' è esausto!');
    if (B.fi < B.fo.length - 1) {
      B.fi++;
      say('L\'avversario manda in campo ' + nm(B.fo[B.fi]) + '!');
      applyAbilityOnEntry(B.fo[B.fi], B.me[B.mi], say);
    } else {
      B.over = 'win';
      return true;
    }
  }

  if (me.hp <= 0) {
    say(nm(me) + ' è esausto!');
    if (B.mi < B.me.length - 1) {
      B.mi++;
      say('Vai, ' + nm(B.me[B.mi]) + '!');
      applyAbilityOnEntry(B.me[B.mi], B.fo[B.fi], say);
    } else {
      B.over = 'lose';
      return true;
    }
  }
  return false;
}

function turn(mi) {
  const me = B.me[B.mi];
  const fo = B.fo[B.fi];
  function say(t) { B.log.push(t); }

  const order = [
    [me, fo, me.moves[mi], true],
    [fo, me, chooseNpc(fo, me), false]
  ];

  order.sort((x, y) => {
    const spdA = getStat(x[0], 'speed');
    const spdB = getStat(y[0], 'speed');
    return (y[2].priority - x[2].priority) || (spdB - spdA) || (Math.random() - 0.5);
  });

  for (const item of order) {
    const a = item[0];
    const d = item[1];
    const m = item[2];
    const mine = item[3];

    if (a.hp <= 0 || d.hp <= 0 || B.over) continue;
    say((mine ? '' : 'Avversario: ') + nm(a) + ' usa ' + locName(m) + '!');

    if (Math.random() * 100 > (m.accuracy || 100)) {
      say('Ma fallisce!');
      continue;
    }

    if (m.damage_class === 'status' || !m.power) {
      // Gestione Mosse di Stato
      if (m.stat_changes && m.stat_changes.length) {
        m.stat_changes.forEach(sc => {
          const target = (m.target === 'user' || m.target === 'selected-pokemon-user') ? a : d;
          modifyStage(target, sc.stat, sc.change, say);
        });
      } else {
        say('Nessun effetto visibile...');
      }
      continue;
    }

    const e = mult(m.type, d);
    if (e === 0) {
      say('Non ha effetto...');
      continue;
    }

    let x = dmg(a, d, m);
    const crit = Math.random() < 1 / 16;
    if (crit) x = Math.floor(x * 1.5);

    if (d.hp === d.s.hp && x >= d.hp && d.heldItem === 'focus-sash') {
      x = d.hp - 1;
      say(nm(d) + ' resiste con 1 PS grazie al Focalnastro!');
    }

    d.hp = Math.max(0, d.hp - x);
    say(x + ' danni' + (crit ? ' (Colpo Critico!)' : '') + (e > 1 ? ' — Superefficace!' : (e < 1 ? ' — Poco efficace...' : '')));

    if (checkFaint(say)) break;

    // Danni da abilità da contatto
    if (m.damage_class === 'physical' && (d.ability === 'iron-barbs' || d.ability === 'rough-skin') && a.hp > 0) {
      const rec = Math.floor(a.s.hp / 8);
      a.hp = Math.max(0, a.hp - rec);
      say(nm(a) + ' subisce danni da contatto!');
      if (checkFaint(say)) break;
    }

    // Effetti passivi strumenti
    if (m.damage_class === 'physical' && d.heldItem === 'rocky-helmet' && a.hp > 0) {
      const rec = Math.floor(a.s.hp / 6);
      a.hp = Math.max(0, a.hp - rec);
      say(nm(a) + ' subisce danni dal Bitorzolelmo!');
      if (checkFaint(say)) break;
    }

    if (a.heldItem === 'life-orb' && a.hp > 0) {
      const orbDmg = Math.floor(a.s.hp / 10);
      a.hp = Math.max(0, a.hp - orbDmg);
      say(nm(a) + ' perde PS per l\'Assorbisfera!');
      if (checkFaint(say)) break;
    }

    if (a.heldItem === 'leftovers' && a.hp > 0 && a.hp < a.s.hp) {
      const heal = Math.floor(a.s.hp / 16);
      a.hp = Math.min(a.s.hp, a.hp + heal);
      say(nm(a) + ' recupera PS con Avanzi!');
    }
  }
  fight();
}

function endBattle() {
  const win = B.over === 'win';

  let itemMsg = '';
  if (win && Math.random() < 0.65) {
    run.items = run.items || {};
    const possibleDrops = ['potion', 'max-potion', 'leftovers', 'life-orb', 'choice-band', 'choice-specs', 'choice-scarf', 'focus-sash', 'rocky-helmet'];
    const dropped = rnd(possibleDrops);
    run.items[dropped] = (run.items[dropped] || 0) + 1;
    const nameFound = D.items[dropped] ? locName(D.items[dropped]) : dropped;
    itemMsg = 'Hai trovato: 1x ' + nameFound + '!';
  }

  run.level = win ? run.level + 1 : Math.max(1, run.level - 1);
  const cap = win && CAP.find(c => run.level >= c && !run.taken.includes(c));

  if (win && run.level >= (run.nextTrade || 7)) {
    run.nextTrade = run.level + 7 + Math.floor(Math.random() * 2);
    saveRun();
    triggerTradeOffer(itemMsg);
    return;
  }

  if (cap) {
    run.taken.push(cap);
    saveRun();
    capture(itemMsg);
  } else {
    saveRun();
    hub(win ? 'Vittoria! Livello +1. ' + itemMsg : 'Sconfitta. Livello -1.');
  }
}

function triggerTradeOffer(extraMsg = '') {
  const L = run.level;
  const have = new Set(run.team.map(t => t.name));
  const pool = Object.values(D.pokemon).filter(p => eligible(p, L) && p.final_types.includes(run.type) && !have.has(p.name));

  if (!pool.length) {
    hub('Nessun Pokémon per lo scambio. ' + extraMsg);
    return;
  }

  const offeredMon = rnd(pool);

  let teamOptions = '';
  run.team.forEach((t, idx) => {
    teamOptions += '<div class="team-list-item">' +
      '<div style="display:flex;align-items:center;gap:10px">' +
        '<img src="' + (D.pokemon[t.name].sprite || '') + '" width="48" alt="">' +
        '<div><b>' + locName(D.pokemon[t.name]) + '</b></div>' +
      '</div>' +
      '<button onclick="executeTrade(' + idx + ', \'' + offeredMon.name + '\')">Scambia</button>' +
    '</div>';
  });

  app().innerHTML =
    '<h1>' + tTxt('tradeTitle') + '</h1>' +
    '<p class="mut" style="text-align:center">' + tTxt('tradeDesc') + '<b>' + locName(offeredMon) + '</b>' + tTxt('tradeFor') + '</p>' +
    '<div style="text-align:center;margin:16px 0"><img src="' + (offeredMon.sprite || '') + '" width="96" alt=""></div>' +
    '<h2>Scegli chi cedere:</h2>' +
    '<div style="margin:16px 0">' + teamOptions + '</div>' +
    '<button id="decline" class="btn-sec" style="width:100%">' + tTxt('declineTrade') + '</button>';

  getEl('#decline').onclick = () => hub('Hai rifiutato lo scambio. ' + extraMsg);
}

window.executeTrade = function(teamIndex, newMonName) {
  selectNatureForMon(newMonName, (natName) => {
    const oldName = locName(D.pokemon[run.team[teamIndex].name]);
    const heldItem = run.team[teamIndex].heldItem;

    if (heldItem) run.items[heldItem] = (run.items[heldItem] || 0) + 1;

    const pData = D.pokemon[newMonName];
    const newAbility = pData.abilities && pData.abilities.length ? rnd(pData.abilities) : null;

    run.team[teamIndex] = {
      name: newMonName,
      nat: natName,
      currentHp: null,
      heldItem: null,
      ability: newAbility
    };

    saveRun();
    hub('Scambio effettuato! Ceduto ' + oldName + ', ricevuto ' + locName(D.pokemon[newMonName]) + '!');
  });
};

function capture(extraMsg = '') {
  const L = run.level;
  const have = new Set(run.team.map(t => t.name));
  const pool = Object.values(D.pokemon).filter(p => eligible(p, L) && p.final_types.includes(run.type) && !have.has(p.name));
  const opts = shuffle(pool).slice(0, 3);

  if (!opts.length || run.team.length >= 6) {
    hub('Nessuna cattura disponibile. ' + extraMsg);
    return;
  }

  let optsHtml = '';
  opts.forEach(p => {
    optsHtml += '<button data-n="' + p.name + '"><img src="' + (p.sprite || '') + '" width="72" alt=""><br><b>' + locName(p) + '</b><br>' + p.types.map(tagHtml).join('') + '</button>';
  });

  app().innerHTML =
    '<h1>' + tTxt('newCapture') + '</h1>' +
    '<p class="mut" style="text-align:center">' + tTxt('captureDesc') + '</p>' +
    '<div class="grid">' + optsHtml + '</div>';

  document.querySelectorAll('[data-n]').forEach(b => {
    b.onclick = () => selectNatureForMon(b.dataset.n, (natName) => {
      const pData = D.pokemon[b.dataset.n];
      const ability = pData.abilities && pData.abilities.length ? rnd(pData.abilities) : null;
      run.team.push({ name: b.dataset.n, nat: natName, currentHp: null, heldItem: null, ability: ability });
      saveRun();
      hub('Nuovo compagno aggiunto! ' + extraMsg);
    });
  });
}

async function load() {
  try {
    const files = ['types', 'natures', 'moves', 'pokemon', 'items'];
    const promises = files.map(f => fetch('data/' + f + '.json').then(r => {
      if (!r.ok) throw new Error('HTTP error ' + r.status);
      return r.json();
    }));

    const results = await Promise.all(promises);
    D = {
      types: results[0].types,
      eff: results[0].effectiveness,
      natures: results[1],
      moves: results[2],
      pokemon: results[3],
      items: results[4]
    };
    home();
  } catch (e) {
    console.error(e);
    app().innerHTML = '<h1>Errore Dati</h1><p class="mut">Assicurati che la cartella data/ contenga tutti i file JSON.</p>';
  }
}

load();
</script>
</body>
</html>
